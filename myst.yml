# Jupyter Book 2 / MyST configuration.
# Build:   jupyter book build --html           (from the outputs stored in the notebooks)
#          jupyter book build --html --execute (re-executes every notebook)
# Preview: jupyter book start
# Docs:    https://mystmd.org/guide
version: 1
project:
  title: Numerical Methods in the Python Ecosystem
  authors:
    - name: Janko Slavič
      affiliations:
        - Faculty of Mechanical Engineering, University of Ljubljana
  github: jankoslavic/pyNumericalMethods
  license:
    content: CC-BY-NC-4.0
  # PDF of the whole book: python .github/build_pdf.py (see the script)
  exports:
    - format: pdf
      template: ./pdf/template
      output: _build/exports/pyNumericalMethods.pdf
      language: english
      online_url: https://jankoslavic.github.io/pyNumericalMethods/
      first_chapter: 0
  downloads:
    - url: https://jankoslavic.github.io/pyNumericalMethods/pyNumericalMethods.pdf
      title: Whole book (PDF)
  toc:
    - file: README.md
    - file: notebooks/Study and Examination Rules.ipynb
    - file: notebooks/Lecture 01 - Introduction to Python.ipynb
    - file: notebooks/Lecture 02 - Printing, file handling, functions, modules.ipynb
    - file: notebooks/Lecture 03 - Modules, NumPy, Matplotlib.ipynb
    - file: notebooks/Lecture 04 - Object-oriented programming, symbolic computation.ipynb
    - file: notebooks/Lecture 05 - Introduction to numerical methods and systems of linear equations 1.ipynb
    - file: notebooks/Lecture 06 - Systems of linear equations 2.ipynb
    - file: notebooks/Lecture 07 - Interpolation.ipynb
    - file: notebooks/Lecture 08 - Approximation.ipynb
    - file: notebooks/Lecture 09 - Root finding.ipynb
    - file: notebooks/Lecture 10 - Numerical differentiation.ipynb
    - file: notebooks/Lecture 11 - Numerical integration.ipynb
    - file: notebooks/Lecture 12 - Numerical solution of differential equations - initial value problem.ipynb
    - file: notebooks/Lecture 13 - Numerical solution of differential equations - boundary value problem.ipynb
    - file: notebooks/Lecture 14 - Testing code correctness, user interface.ipynb
    - file: bibliography.md
site:
  template: book-theme
  options:
    logo: logo.png
    logo_text: Numerical Methods
    folders: true
